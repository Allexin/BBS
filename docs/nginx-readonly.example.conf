# Replace C:/BackupSystem/Stable with the deployment root during installation.
server {
    listen 8080;
    server_name _;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;

    location /backup-status/logs/ {
        alias C:/BackupSystem/Stable/data/public/logs/;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location = /backup-status/status.json {
        alias C:/BackupSystem/Stable/data/public/status.json;
        limit_except GET { deny all; }
    }

    location = /backup-status/health.json {
        alias C:/BackupSystem/Stable/data/public/health.json;
        limit_except GET { deny all; }
    }

    location /backup-status/ {
        alias C:/BackupSystem/Stable/web/;
        index index.html;
        limit_except GET { deny all; }
        try_files $uri $uri/ =404;
    }
}
